<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZoomZeem Hub</title>
<meta name="description" content="Drop your idea. The studio checks it in front of you and hands you a verdict you can read the reasons for.">
<style>
/* ZoomZeem Hub. One stylesheet, no build step, no web fonts, no network request.
   Implements docs/brand/DESIGN-LANGUAGE.md. The token block below is the part another
   ZoomZeem surface copies; everything under it is this Hub's markup.

   The one saturated colour (--seal) never appears on a call to action. It marks checked
   proof and nothing else. See DESIGN-LANGUAGE.md section 4. */

:root {
  /* --- paper and ink --- */
  --paper: #F7F5EF; --card: #FFFFFF; --ink: #17150F; --ink-soft: #55524A;
  --rule: #DDD8CB; --rule-soft: #EAE6DA;
  --focus: #A63D00;

  /* --- the four states: checked / not proven / unknown / stopped --- */
  --seal: #1E5B41;    --seal-wash: #E4EFE8;
  --flag: #8F3A1E;    --flag-wash: #F7E7E1;
  --unknown: #55524A; --unknown-wash: #EDEAE0;
  --ended: #46433B;   --ended-wash: #E9E6DC;

  /* --- type --- */
  --display: "Iowan Old Style", Palatino, Georgia, "Times New Roman", serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --record: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* --- shape and rhythm --- */
  --r: 14px; --r-sm: 10px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 72px;
  --shadow: 0 1px 1px rgba(23,21,15,.04), 0 3px 10px -4px rgba(23,21,15,.12);
  --lift: 0 2px 4px rgba(23,21,15,.06), 0 12px 28px -12px rgba(23,21,15,.24);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141310; --card: #1E1C18; --ink: #F3F0E8; --ink-soft: #B6B2A6;
    --rule: #3A382F; --rule-soft: #2C2A24; --focus: #FFB27A;
    --seal: #86C8A3; --seal-wash: #1B3326;
    --flag: #EFA392; --flag-wash: #38211B;
    --unknown: #B6B2A6; --unknown-wash: #2A2824;
    --ended: #CFCBBF; --ended-wash: #2C2A24;
    --shadow: 0 1px 0 rgba(0,0,0,.45); --lift: 0 12px 28px -14px rgba(0,0,0,.75);
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 16px/1.6 var(--body); -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 0 var(--s4); }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: var(--s2); top: var(--s2); z-index: 20; background: var(--card);
  padding: var(--s2) var(--s3); border-radius: var(--r-sm); }

/* ---------- the seal: the ZoomZeem mark ---------- */
.seal {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; flex: none; border-radius: 5px;
  background: var(--seal); color: var(--card); font-size: 12px; font-weight: 700; line-height: 1;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seal { color: #14231A; } }

/* ---------- header ---------- */
.top { background: var(--card); border-bottom: 1px solid var(--rule); position: sticky; top: 0; z-index: 10; }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: var(--s3) var(--s4); max-width: 760px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: var(--s2); font-weight: 650; letter-spacing: -.01em; text-decoration: none; }
.brand-z { font-family: var(--display); font-size: 1.15rem; }
.nav { display: flex; gap: var(--s1); flex-wrap: wrap; border-top: 1px solid var(--rule-soft); padding: 0 var(--s4); max-width: 760px; margin: 0 auto; }
.nav a {
  min-height: 44px; display: inline-flex; align-items: center; padding: 0 var(--s3);
  font-size: .9rem; font-weight: 600; color: var(--ink-soft); text-decoration: none;
  border-bottom: 2px solid transparent;
}
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }

/* ---------- honesty banner ---------- */
.honesty {
  background: var(--card); border: 1px solid var(--rule); border-radius: var(--r);
  padding: var(--s4); margin: var(--s5) 0; font-size: .9rem; color: var(--ink-soft);
}
.honesty p { margin: 0 0 var(--s2); }
.honesty p:last-child { margin-bottom: 0; }
.honesty .attrib { color: var(--ink); font-weight: 600; display: flex; align-items: center; gap: var(--s2); }
.honesty a { color: var(--ink); }

/* ---------- type ---------- */
main { padding: var(--s5) 0 var(--s8); }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2rem, 1.5rem + 2.4vw, 3rem);
  line-height: 1.1; letter-spacing: -.02em; margin: 0 0 var(--s3); }
h2 { font-family: var(--display); font-weight: 400; font-size: clamp(1.5rem, 1.25rem + 1.2vw, 2rem);
  line-height: 1.15; letter-spacing: -.02em; margin: var(--s7) 0 var(--s3); }
h3 { font-size: 1.05rem; line-height: 1.35; margin: 0; letter-spacing: -.01em; }
p { margin: var(--s2) 0; }
.lead { color: var(--ink-soft); max-width: 62ch; margin-bottom: var(--s5); }
.muted { color: var(--ink-soft); }
.small { font-size: .875rem; }
.label { font-family: var(--record); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-soft); margin: 0; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  min-height: 48px; padding: var(--s3) var(--s5); border-radius: var(--r-sm);
  border: 1px solid var(--rule); background: var(--card); color: var(--ink);
  font: inherit; font-weight: 600; cursor: pointer; text-decoration: none;
}
.btn:hover { border-color: var(--ink-soft); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.primary:hover { opacity: .9; }
.btn.block { width: 100%; }
.btn.quiet { border-color: transparent; background: transparent; text-decoration: underline; min-height: 44px; padding: var(--s2) var(--s2); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.opt { justify-content: space-between; text-align: left; width: 100%; padding: var(--s4) var(--s4); }
.btn.opt .rec { font-family: var(--record); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }

/* ---------- start screen ---------- */
.start-box { background: var(--card); border: 1px solid var(--rule); border-radius: var(--r);
  padding: var(--s5); box-shadow: var(--shadow); margin-bottom: var(--s4); }
label { display: block; font-weight: 600; margin-bottom: var(--s2); }
textarea {
  width: 100%; font: inherit; color: var(--ink); background: var(--paper);
  border: 1px solid var(--rule); border-radius: var(--r-sm); padding: var(--s3); resize: vertical;
}
.chips { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s3); }
.chip {
  min-height: 44px; padding: var(--s2) var(--s4); border-radius: 999px;
  border: 1px solid var(--rule); background: var(--card); color: var(--ink);
  font: inherit; font-size: .9rem; font-weight: 600; cursor: pointer; text-align: left;
}
.chip:hover { border-color: var(--ink-soft); }
.budget { display: flex; align-items: center; gap: var(--s2); color: var(--ink-soft); font-size: .875rem; margin-top: var(--s4); }

/* ---------- the margin rule: provenance hangs off it ---------- */
.ruled { border-left: 2px solid var(--rule); padding-left: var(--s4); margin: 0; list-style: none; }

/* ---------- narration feed ---------- */
.feed { display: grid; gap: var(--s4); }
.feed li { opacity: 0; transform: translateY(4px); animation: in .25s ease forwards; }
@keyframes in { to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .feed li { animation: none; opacity: 1; transform: none; } }
.feed .who { font-family: var(--record); font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.feed .what { margin: 2px 0 0; }
.feed li.is-block .what { color: var(--flag); font-weight: 600; }
.working-head { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s5); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); flex: none; }
@media (prefers-reduced-motion: no-preference) { .dot { animation: pulse 1.2s ease-in-out infinite; } }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

/* ---------- proof ---------- */
.proof { border-radius: var(--r-sm); margin: var(--s4) 0 0; border: 1px solid var(--rule-soft); background: var(--paper); }
.proof-line { display: flex; gap: var(--s3); align-items: flex-start; margin: 0; padding: var(--s4); font-weight: 600; line-height: 1.45; }
.mark { font-family: var(--record); flex: none; width: 18px; text-align: center; font-weight: 700; }
.proof.s-checked { background: var(--seal-wash); border-color: transparent; } .proof.s-checked .proof-line { color: var(--seal); }
.proof.s-flag    { background: var(--flag-wash); border-color: transparent; } .proof.s-flag .proof-line { color: var(--flag); }
.proof.s-unknown { background: var(--unknown-wash); border-color: transparent; } .proof.s-unknown .proof-line { color: var(--unknown); }
.proof.s-ended   { background: var(--ended-wash); border-color: transparent; } .proof.s-ended .proof-line { color: var(--ended); }
.proof details { margin: 0; }
.proof summary { min-height: 44px; display: flex; align-items: center; padding: 0 var(--s4); cursor: pointer; font-size: .9rem; font-weight: 600; }
.proof details[open] summary { border-bottom: 1px solid var(--rule-soft); }
.trail { display: grid; gap: var(--s4); padding: var(--s4); background: var(--card); border-radius: 0 0 var(--r-sm) var(--r-sm); }
.trail > li > .label { margin-bottom: 2px; }
.trail .val { font-weight: 600; margin: 0; overflow-wrap: anywhere; }
.trail .note { color: var(--ink-soft); font-size: .9rem; margin: 2px 0 0; }
.refs { margin: var(--s2) 0 0; display: flex; flex-wrap: wrap; gap: var(--s2); }
.ref { font-family: var(--record); font-size: .75rem; color: var(--ink-soft);
  background: var(--unknown-wash); border-radius: 5px; padding: 2px 7px; overflow-wrap: anywhere; }
.gap .val { color: var(--ink); }

/* ---------- decision ---------- */
.decide { background: var(--card); border: 1px solid var(--rule); border-radius: var(--r);
  padding: var(--s5); margin: var(--s5) 0; box-shadow: var(--shadow); }
.decide .q { font-family: var(--display); font-weight: 400; font-size: 1.35rem; line-height: 1.25; margin: 0 0 var(--s4); letter-spacing: -.01em; }
.opts { display: grid; gap: var(--s2); }
.silence { color: var(--ink-soft); font-size: .875rem; margin-top: var(--s4); }
.done { display: flex; gap: var(--s3); align-items: flex-start; }

/* ---------- cards and stats ---------- */
.stats { display: flex; flex-wrap: wrap; gap: var(--s2); padding: 0; margin: 0 0 var(--s5); list-style: none; }
.stats li { border: 1px solid var(--rule); background: var(--card); border-radius: 999px;
  padding: var(--s2) var(--s4); font-size: .875rem; }
.stats b { font-variant-numeric: tabular-nums; }
.stats .date { font-family: var(--record); font-size: .75rem; color: var(--ink-soft); }
.card { background: var(--card); border: 1px solid var(--rule-soft); border-radius: var(--r);
  box-shadow: var(--shadow); padding: var(--s5); margin: var(--s3) 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); flex-wrap: wrap; }
.stage { font-family: var(--record); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap; }
.row-end { display: flex; justify-content: flex-end; margin-top: var(--s4); }

/* ---------- record ---------- */
.grp { margin: 0 0 var(--s6); }
.grp-head { font-family: var(--body); font-size: .95rem; font-weight: 650; letter-spacing: 0;
  padding-bottom: var(--s2); border-bottom: 2px solid var(--rule); margin: 0 0 var(--s3); }
.steps { list-style: none; margin: 0; padding: 0; }
.steps li { padding: var(--s3) 0; border-bottom: 1px solid var(--rule-soft); }
.steps li:last-child { border-bottom: none; }
.steps .when { font-family: var(--record); font-size: .75rem; color: var(--ink-soft); margin-top: 2px; }
.res { font-weight: 700; }
.t-checked { color: var(--seal); } .t-flag { color: var(--flag); }
.t-unknown { color: var(--unknown); } .t-ended { color: var(--ended); } .t-neutral { color: var(--ink-soft); }

/* ---------- empty ---------- */
.empty { text-align: center; background: var(--card); border: 1px solid var(--rule-soft);
  border-radius: var(--r); padding: var(--s8) var(--s4); }
.empty h2 { margin: var(--s3) 0 var(--s2); }
.empty p { max-width: 46ch; margin-left: auto; margin-right: auto; color: var(--ink-soft); }

/* ---------- loading ---------- */
.skeleton { display: grid; gap: var(--s3); }
.sk { background: var(--rule-soft); border-radius: 8px; height: 14px; display: block; }
.sk.h1 { height: 34px; width: 60%; } .sk.wide { width: 85%; } .sk.short { width: 40%; }
.sk-card { background: var(--card); border: 1px solid var(--rule-soft); border-radius: var(--r);
  padding: var(--s5); display: grid; gap: var(--s3); }
@media (prefers-reduced-motion: no-preference) { .sk { animation: pulse 1.4s ease-in-out infinite; } }

footer { border-top: 1px solid var(--rule); margin-top: var(--s8); padding: var(--s5) 0; color: var(--ink-soft); font-size: .85rem; }
footer a { color: var(--ink); }

/* ============================================================================
   Hub v1 arc: home > running > venture card > account > dashboard > record
   Added after the owner's 18 Oct direction. Same tokens, no new colours.
   ============================================================================ */

/* ---------- home: the homepage IS the product ---------- */
.hero { padding: var(--s7) 0 var(--s6); }
.hero.narrow { max-width: 30rem; }
.attrib { display: flex; align-items: center; gap: var(--s2); font-size: .875rem;
  color: var(--ink-soft); margin: 0 0 var(--s6); }
.attrib a { color: var(--ink); }
.hero h1 { font-size: clamp(2.6rem, 2rem + 3.4vw, 4.2rem); margin-bottom: var(--s4); }
.lead.big { font-size: 1.125rem; max-width: 34ch; }
.box { background: var(--card); border: 1px solid var(--rule); border-radius: var(--r);
  padding: var(--s4); box-shadow: var(--shadow); margin-top: var(--s5); }
.box textarea, .box input[type="email"] {
  width: 100%; font: inherit; color: var(--ink); background: var(--paper);
  border: 1px solid var(--rule); border-radius: var(--r-sm); padding: var(--s3); resize: vertical;
}
.box input[type="email"] { min-height: 48px; }
.box-go { display: flex; align-items: center; gap: var(--s4); flex-wrap: wrap; margin-top: var(--s3); }
.btn.big { min-height: 54px; font-size: 1.0625rem; padding: var(--s3) var(--s6); }
.note-demo { background: var(--unknown-wash); border-radius: var(--r-sm); padding: var(--s3) var(--s4);
  color: var(--ink-soft); font-size: .875rem; margin-top: var(--s4); }
.budget { display: flex; align-items: center; gap: var(--s2); color: var(--ink-soft);
  font-size: .875rem; margin-top: var(--s5); }

/* ---------- running ---------- */
.run-head { display: flex; align-items: center; gap: var(--s3); margin: var(--s6) 0 var(--s5); }
.run-head h1 { margin: 0; }
.run-stage { margin-bottom: var(--s5); }
.run-stage .label { margin-bottom: var(--s3); }
.tick { color: var(--seal); }
.feed { display: grid; gap: var(--s4); margin: 0; padding-left: var(--s4); list-style: none; }
.feed li { opacity: 0; animation: fin .25s ease forwards; }
@keyframes fin { to { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .feed li { animation: none; opacity: 1 } }
.feed .who { font-family: var(--record); font-size: .72rem; letter-spacing: .06em;
  text-transform: uppercase; color: var(--ink-soft); margin: 0; }
.feed .what { margin: 2px 0 0; }
.feed li.is-block .what { color: var(--flag); font-weight: 600; }
.tightfeed { gap: var(--s3); }
.run-go { margin-top: var(--s6); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink); flex: none; display: inline-block; }
.dot.sm { width: 7px; height: 7px; }
@media (prefers-reduced-motion: no-preference) { .dot { animation: pulse 1.2s ease-in-out infinite } }

/* ---------- the venture card: the aha ---------- */
.vcard { background: var(--card); border: 1px solid var(--rule); border-radius: var(--r);
  padding: var(--s6) var(--s5); box-shadow: var(--lift); }
.vcard h1 { font-size: clamp(2.4rem, 1.9rem + 2.8vw, 3.4rem); margin: var(--s2) 0 var(--s3); }
.vline { font-size: 1.0625rem; max-width: 56ch; margin-bottom: var(--s5); }
.vgrid { display: flex; flex-wrap: wrap; gap: var(--s5); padding: var(--s5) 0;
  border-top: 1px solid var(--rule-soft); border-bottom: 1px solid var(--rule-soft); }
.vscore { flex: 1 1 14rem; } .vverdict { flex: 1 1 12rem; }
.num { font-family: var(--display); font-size: 3.2rem; line-height: 1; margin: var(--s2) 0 0; }
.num .of { font-size: 1.1rem; color: var(--ink-soft); }
.conf { display: flex; align-items: center; gap: var(--s1); font-weight: 600; margin: var(--s2) 0 0; }
.basis { margin-top: var(--s2); max-width: 44ch; }
.vverdict .word { display: flex; align-items: flex-start; gap: var(--s2); font-weight: 700;
  font-size: 1.15rem; margin: var(--s2) 0 0; }
.assume { padding: var(--s5) 0; border-bottom: 1px solid var(--rule-soft); }
.a-text { font-family: var(--display); font-size: 1.5rem; line-height: 1.3; margin: var(--s2) 0 var(--s3); }
.a-test { margin-top: var(--s3); }
.brandbox { padding: var(--s5) 0; border-bottom: 1px solid var(--rule-soft); }
.b-line { font-family: var(--display); font-size: 1.35rem; margin: var(--s2) 0 var(--s3); }
.pal { display: flex; flex-wrap: wrap; gap: var(--s3); list-style: none; padding: 0; margin: 0 0 var(--s2); }
.pal li { display: flex; align-items: center; gap: var(--s2); font-size: .875rem; }
.sw { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--rule); display: inline-block; }
.vgo { margin-top: var(--s5); }
.vgo .muted { margin-top: var(--s2); }
.done-line { display: flex; align-items: center; gap: var(--s2); font-weight: 600; margin: 0 0 var(--s3); }

/* ---------- dashboard ---------- */
.dash { display: grid; gap: var(--s5); }
@media (min-width: 60rem) { .dash { grid-template-columns: 15rem 1fr; gap: var(--s6); align-items: start; } }
.rail { display: grid; gap: var(--s1); }
.rail .label { margin-bottom: var(--s2); }
.rail .date { font-family: var(--record); text-transform: none; letter-spacing: 0; }
.rv { display: grid; gap: 2px; padding: var(--s3); border-radius: var(--r-sm);
  border: 1px solid transparent; text-decoration: none; color: var(--ink); min-height: 44px; }
.rv:hover { background: var(--card); border-color: var(--rule-soft); }
.rv.on { background: var(--card); border-color: var(--rule); box-shadow: var(--shadow); }
.rv-name { font-weight: 650; }
.rv-meta { display: flex; align-items: center; gap: var(--s1); font-size: .8rem; color: var(--ink-soft); }
.rv-score { margin-left: auto; font-family: var(--record); }
.brief { background: var(--card); border: 1px solid var(--rule); border-radius: var(--r);
  padding: var(--s5); margin-bottom: var(--s5); box-shadow: var(--shadow); }
.b-h { font-weight: 650; margin: var(--s4) 0 var(--s1); }
.tight { margin: 0; padding-left: var(--s4); }
.tight li { margin: var(--s1) 0; }
.livefeed { margin: var(--s5) 0; }
.livefeed .label { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s3); }

/* ---------- approval cards: why + reversibility ---------- */
.appr { background: var(--card); border: 1px solid var(--rule); border-radius: var(--r);
  padding: var(--s5); margin: var(--s3) 0; box-shadow: var(--shadow); }
.a-what { font-family: var(--display); font-size: 1.35rem; line-height: 1.3; margin: 0; }
.rev { display: flex; align-items: flex-start; gap: var(--s2); font-weight: 600; margin: var(--s1) 0 var(--s2); }
.rev.yes { color: var(--seal); } .rev.no { color: var(--flag); }
.opts2 { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s4); }
.appr.done { background: var(--seal-wash); border-color: transparent; }

/* ---------- the A to Z arc ---------- */
.arc { list-style: none; margin: 0; padding: 0 0 0 var(--s4); border-left: 2px solid var(--rule); }
.arc-step { padding: var(--s3) 0 var(--s4); border-bottom: 1px solid var(--rule-soft); }
.arc-step:last-child { border-bottom: none; }
.arc-head { display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap; }
.arc-head b { font-size: 1.05rem; }
.arc-step .tight { margin-top: var(--s2); color: var(--ink-soft); }
.arc-step.s-checked .arc-head .mark { color: var(--seal); }
.arc-step.s-flag .arc-head .mark { color: var(--flag); }
.arc-step.s-unknown .arc-head .mark { color: var(--unknown); }
.arc-step.s-ended .arc-head .mark { color: var(--ended); }

/* The dashboard is the one screen that earns a wider column: it is two columns by design.
   Every other screen stays at reading width. */
.wrap.wide { max-width: 1100px; }

/* Every link is a real target, including the ones sitting inside a sentence.
   WCAG 2.5.8 would exempt an inline link, but the reviewer's point stands: an exemption is not
   the same as a usable target, and these two are the only links on some routes. */
.attrib a, footer a {
  display: inline-block; min-height: 44px; line-height: 44px;
  padding: 0 var(--s2); margin: 0 calc(var(--s2) * -1);
  border-radius: var(--r-sm); text-decoration: underline;
}
.attrib { min-height: 44px; }
footer p { margin: var(--s1) 0; }
/* Inline links inside prose get the same treatment where they are a primary way forward. */
.done-line + .muted a, .appr.done a { display: inline-block; min-height: 44px; line-height: 44px;
  padding: 0 var(--s2); margin: 0 calc(var(--s2) * -1); border-radius: var(--r-sm); }
</style>

<script>
/* ZoomZeem Hub. Plain JavaScript, no build step, no libraries, no network request.
 *
 * The arc, from the owner's direction (18 Oct 2026):
 *   home      the homepage IS the product. One box, no nav, no signup.
 *   running   the referee runs and narrates what it is doing, with receipts.
 *   venture   THE AHA. A named venture card: score with its confidence, a verdict in words,
 *             the one assumption that makes or breaks it, a brand direction, and one button.
 *   account   only after the aha, and only when pressing the button needs it.
 *   dashboard the living A to Z: Verdict > Plan > Build > Launch > Run, approvals, feed, brief.
 *   record    every step, every refusal, every stopped venture with its reason.
 *
 * Reads window.HUB_DATA (see data.js) and nothing else. Honesty labels are driven by
 * HUB_DATA.source, so wiring real data cannot leave a stale "demo" label behind.
 *
 * Nothing here runs anything. A decision is recorded in this browser tab and nowhere else:
 * there is no account, no server and no stored file. Reload and it starts again.
 */
(function () {
  "use strict";

  var D = window.HUB_DATA;
  var isDemo = D.source === "demo";

  // Everything below is in memory only, on purpose. See the storage line in the footer.
  var answered = {};      // approval id -> "approved" | "declined"
  var started = {};       // venture id -> true once "Build the first slice" was pressed
  var events = [];        // what the Record screen shows for things you did this visit
  var account = false;    // has the (stubbed) account step been passed
  var pending = null;     // venture waiting on the account step
  var step = 0;           // how many narration lines are visible
  var timer = null;

  var STATE = {
    checked: { mark: "✓", word: "Checked" },
    flag:    { mark: "⚠", word: "Not proven" },
    unknown: { mark: "?",      word: "Unknown" },
    ended:   { mark: "✕", word: "Stopped" }
  };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function $(s) { return document.querySelector(s); }
  function v(id) { return D.ventures.filter(function (x) { return x.id === id; })[0]; }
  function mark(st) {
    var s = STATE[st] || STATE.unknown;
    return '<span class="mark" aria-hidden="true">' + s.mark + '</span><span class="sr">' + s.word + ": </span>";
  }
  function lines() {
    var out = [];
    D.run.stages.forEach(function (st) {
      st.lines.forEach(function (l) { out.push({ stage: st.label, who: l.who, text: l.text, receipt: l.receipt }); });
    });
    return out;
  }
  var ALL = lines();
  // The demo's real duration, computed from what actually happens: the first line shows at once,
  // each later line waits one interval. Never written by hand, so the copy cannot go stale.
  var INTERVAL = D.run.demo_interval_ms || 620;
  var DEMO_SECONDS = Math.max(1, Math.round((ALL.length - 1) * INTERVAL / 1000));

  // ---- proof -----------------------------------------------------------------------------
  function proof(p, open) {
    if (!p) return "";
    var rows = p.trail.map(function (t) {
      return "<li><p class=\"label\">" + esc(t.label) + '</p><p class="val">' + esc(t.value) + "</p>" +
        (t.note ? '<p class="note">' + esc(t.note) + "</p>" : "") +
        (t.refs && t.refs.length ? '<p class="refs">' + t.refs.map(function (r) {
          return '<span class="ref">' + esc(r) + "</span>"; }).join("") + "</p>" : "") + "</li>";
    }).join("");
    var gaps = p.gaps.map(function (g) {
      return '<li class="gap"><p class="label">Still missing</p><p class="val">' + esc(g) + "</p></li>";
    }).join("");
    var n = p.trail.length + p.gaps.length;
    return '<div class="proof s-' + esc(p.state) + '">' +
      '<p class="proof-line">' + mark(p.state) + "<span>" + esc(p.headline) + "</span></p>" +
      "<details" + (open ? " open" : "") + "><summary>See the proof&nbsp;<span class=\"muted small\">&middot; " +
      n + (n === 1 ? " thing" : " things") + " on record</span></summary>" +
      '<ol class="trail ruled">' + rows + gaps + "</ol></details></div>";
  }

  // ---- screens ---------------------------------------------------------------------------
  var screens = {

    // 1. The homepage IS the product. One box. No nav, no signup.
    home: function () {
      return '<div class="hero">' +
        '<p class="attrib"><span class="seal" aria-hidden="true">✓</span> A working surface of the ' +
        '<a href="https://github.com/ZoomZeem">ZoomZeem</a> studio.</p>' +
        "<h1>Drop your idea.</h1>" +
        '<p class="lead big">The studio checks it in front of you, then hands you a verdict you can ' +
        "read the reasons for. No account.</p>" +
        '<div class="box">' +
        '<label for="idea" class="sr">Your idea</label>' +
        '<textarea id="idea" rows="3" maxlength="200" placeholder="An app that finds duplicate photos"></textarea>' +
        '<div class="box-go">' +
        '<button class="btn primary big" id="go">Check it</button>' +
        '<span class="muted small">' + (isDemo
          ? "About " + DEMO_SECONDS + " seconds in this demo. A real run takes about " + D.run.seconds + " seconds."
          : "About " + D.run.seconds + " seconds.") + "</span>" +
        "</div></div>" +
        (isDemo ? '<p class="note-demo"><b>Demo.</b> This plays one worked example from the studio’s ' +
          "record and does not read what you type. The real version runs the checks live. Everything " +
          "you see here is made up to show how the Hub reads.</p>" : "") +
        '<p class="budget"><span class="seal" aria-hidden="true">✓</span> Two steps to a named ' +
        "venture with a verdict and the reasons behind it.</p>" +
        "</div>";
    },

    // 2. The referee runs, and narrates it with receipts.
    running: function () {
      var seen = ALL.slice(0, step), done = step >= ALL.length;
      var byStage = [];
      D.run.stages.forEach(function (st) {
        var mine = seen.filter(function (l) { return l.stage === st.label; });
        if (mine.length) byStage.push({ label: st.label, lines: mine,
          done: mine.length === st.lines.length });
      });
      return '<div class="run-head">' + (done ? "" : '<span class="dot" aria-hidden="true"></span>') +
        "<h1>" + (done ? "Done." : "Checking it…") + "</h1></div>" +
        '<p class="sr" role="status">' + (done ? "The check finished." : "The studio is working.") + "</p>" +
        byStage.map(function (s) {
          return '<section class="run-stage"><p class="label">' +
            (s.done ? '<span class="tick" aria-hidden="true">✓</span> ' : "") + esc(s.label) + "</p>" +
            '<ol class="feed ruled">' + s.lines.map(function (l) {
              var flag = /blocked|pushed back|marked its own/i.test(l.text);
              return '<li class="' + (flag ? "is-block" : "") + '"><p class="who">' + esc(l.who) + "</p>" +
                '<p class="what">' + esc(l.text) + "</p>" +
                (l.receipt ? '<p class="refs"><span class="ref">' + esc(l.receipt) + "</span></p>" : "") + "</li>";
            }).join("") + "</ol></section>";
        }).join("") +
        '<div class="run-go">' + (done
          ? '<a class="btn primary big" href="#venture/' + esc(D.ventures[0].id) + '">See the verdict</a>'
          : '<button class="btn" id="skip">Skip the wait</button>') + "</div>";
    },

    // 3. THE AHA. The named venture card.
    venture: function (id) {
      var x = v(id);
      if (!x) return "<h1>Not found</h1>";
      var s = x.score, going = started[x.id];
      return '<p><a class="btn quiet" href="#dashboard">← All ventures</a></p>' +
        '<article class="vcard">' +
        '<p class="label">Your idea, checked</p>' +
        "<h1>" + esc(x.name) + "</h1>" +
        '<p class="vline">' + esc(x.verdict.line) + "</p>" +

        '<div class="vgrid">' +
          '<div class="vscore"><p class="label">Score</p>' +
            '<p class="num">' + s.value + '<span class="of">/' + s.of + "</span></p>" +
            '<p class="conf">' + mark(s.confidence === "High" ? "checked" : "unknown") +
            esc(s.confidence) + " confidence</p>" +
            '<p class="muted small basis">' + esc(s.basis) + "</p></div>" +
          '<div class="vverdict"><p class="label">Verdict</p>' +
            '<p class="word t-' + esc(x.verdict.state) + '">' + mark(x.verdict.state) + esc(x.verdict.word) + "</p>" +
          "</div>" +
        "</div>" +

        '<section class="assume"><p class="label">The one thing that makes or breaks it</p>' +
          "<p class=\"a-text\">" + esc(x.assumption.text) + "</p>" +
          '<p class="muted">' + esc(x.assumption.why) + "</p>" +
          '<p class="a-test"><b>How to find out:</b> ' + esc(x.assumption.test) + "</p></section>" +

        (x.brand ? '<section class="brandbox"><p class="label">Brand direction</p>' +
          '<p class="b-line">“' + esc(x.brand.line) + '”</p>' +
          '<ul class="pal">' + x.brand.palette.map(function (c) {
            return '<li><span class="sw" style="background:' + esc(c.hex) + '"></span>' +
              esc(c.name) + ' <span class="ref">' + esc(c.hex) + "</span></li>"; }).join("") + "</ul>" +
          '<p class="muted small">A starting point, not a finished identity.</p></section>' : "") +

        proof(x.proof, true) +

        '<div class="vgo">' + (going
          ? '<p class="done-line">' + mark("checked") + "First slice started.</p>" +
            '<p class="muted small">Recorded in this tab, on <a href="#record">the record</a>. ' +
            (isDemo ? "Nothing was run." : "") + "</p>" +
            '<a class="btn" href="#dashboard/' + esc(x.id) + '">Open the dashboard</a>'
          : '<button class="btn primary big" data-build="' + esc(x.id) + '">Build the first slice</button>' +
            '<p class="muted small">' + (isDemo ? "Demo: this starts nothing. It shows where the real build would begin."
              : "This starts the first slice of work.") + "</p>") + "</div>" +
        "</article>";
    },

    // 4. The account step. Only reached by pressing the button, never before.
    account: function () {
      var x = pending ? v(pending) : null;
      return '<div class="hero narrow">' +
        '<p class="label">One last thing</p>' +
        "<h1>Keep " + esc(x ? x.name : "this venture") + "?</h1>" +
        '<p class="lead">You have the verdict already. An account only matters now, because from here ' +
        "the studio starts doing work that has to be kept somewhere.</p>" +
        '<div class="box">' +
        '<label for="email">Email</label>' +
        '<input id="email" type="email" autocomplete="email" placeholder="you@example.com">' +
        '<button class="btn primary big block" id="make-account" style="margin-top:16px">Keep it</button>' +
        "</div>" +
        (isDemo ? '<p class="note-demo"><b>Demo.</b> This creates no account and sends no email. ' +
          "Nothing you type here is stored, transmitted or kept: it stays in this browser tab. " +
          "Real sign-in has not been decided yet.</p>" : "") +
        '<p><button class="btn quiet" id="skip-account">Not now, just show me the dashboard</button></p>' +
        "</div>";
    },

    // 5. The living A to Z dashboard.
    dashboard: function (id) {
      var x = id ? v(id) : D.ventures[0];
      if (!x) return "<h1>Nothing here yet</h1>";
      return '<div class="dash">' +
        '<nav class="rail" aria-label="Ventures"><p class="label">Ventures <span class="date">' +
          esc(D.as_of) + "</span></p>" +
          D.ventures.map(function (y) {
            return '<a class="rv' + (y.id === x.id ? " on" : "") + '" href="#dashboard/' + esc(y.id) + '">' +
              "<span class=\"rv-name\">" + esc(y.name) + "</span>" +
              '<span class="rv-meta">' + mark(y.verdict.state) + esc(y.stage) +
              ' <span class="rv-score">' + y.score.value + "</span></span></a>";
          }).join("") + "</nav>" +

        '<div class="main">' +
          (x.brief ? '<section class="brief"><p class="label">Morning brief · ' + esc(x.brief.at) + "</p>" +
            "<p class=\"b-h\">What changed</p><ul class=\"tight\">" +
            x.brief.changed.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("") + "</ul>" +
            "<p class=\"b-h\">What needs you</p><ul class=\"tight\">" +
            x.brief.needs.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("") + "</ul></section>" : "") +

          "<h1>" + esc(x.name) + "</h1>" +
          '<p class="lead">' + esc(x.verdict.line) + "</p>" +

          (x.feed && x.feed.length ? '<section class="livefeed"><p class="label">' +
            '<span class="dot sm" aria-hidden="true"></span> Live action feed</p>' +
            '<ol class="feed ruled tightfeed">' + x.feed.map(function (f) {
              return "<li><p class=\"who\">" + esc(f.who) + ' <span class="ref">' + esc(f.at) + "</span></p>" +
                '<p class="what">' + esc(f.text) + "</p></li>"; }).join("") + "</ol></section>" : "") +

          (x.approvals.length ? "<h2>Needs you</h2>" + x.approvals.map(approval).join("") : "") +

          "<h2>Verdict to Run</h2>" + arc(x) +

          "<h2>The receipt</h2>" + proof(x.proof, false) +
        "</div></div>";
    },

    // 6. The record.
    record: function () {
      return "<h1>The record</h1>" +
        '<p class="lead">Every step the studio took, including the ones it refused. Nothing is removed ' +
        "from here, so a stopped venture cannot quietly come back.</p>" +
        (events.length
          ? "<h2>What you did this visit</h2><ul class=\"steps ruled\">" + events.map(function (e) {
              var ven = v(e.venture);
              return "<li><div><b>" + esc(ven ? ven.name : "") + "</b></div>" +
                "<div>" + esc(e.what) + "</div>" +
                '<div class="when">' + esc(e.note) + "</div></li>";
            }).join("") + "</ul>"
          : '<h2>What you did this visit</h2><p class="muted">Nothing yet. Anything you approve or ' +
            "start appears here, and only here: it is kept in this browser tab and nowhere else.</p>") +
        "<h2>Stopped</h2>" +
        D.ventures.filter(function (x) { return x.verdict.state === "ended"; }).map(function (x) {
          var why = x.proof.trail.filter(function (t) { return t.label === "Why it stopped"; })[0];
          return '<article class="card"><div class="card-head"><h3>' + esc(x.name) + "</h3>" +
            '<span class="stage t-ended">' + mark("ended") + "&nbsp;Stopped</span></div>" +
            "<p>" + esc(why ? why.value : "No reason on record.") + "</p></article>";
        }).join("") +
        "<h2>Every step</h2>" +
        '<p class="muted small" style="margin-bottom:24px">Grouped by venture, newest first. As of ' +
          esc(D.as_of) + ".</p>" +
        D.ventures.map(function (x) {
          return '<section class="grp"><h3 class="grp-head">' + esc(x.name) + "</h3>" + steps(x.steps) + "</section>";
        }).join("");
    }
  };

  // ---- pieces ----------------------------------------------------------------------------
  function approval(a) {
    var got = answered[a.id];
    if (got) {
      return '<article class="appr done"><p class="done-line">' + mark("checked") +
        "You " + esc(got) + " this.</p>" +
        '<p class="muted small">Recorded in this tab. Nothing was run. ' +
        '<a href="#record">See the record</a>.</p></article>';
    }
    return '<article class="appr"><p class="a-what">' + esc(a.what) + "</p>" +
      '<p class="label" style="margin-top:16px">Why</p><p>' + esc(a.why) + "</p>" +
      '<p class="label" style="margin-top:16px">If you change your mind</p>' +
      '<p class="rev ' + (a.reversible ? "yes" : "no") + '">' +
        mark(a.reversible ? "checked" : "flag") +
        (a.reversible ? "Reversible. " : "Cannot be undone. ") + esc(a.undo) + "</p>" +
      '<p class="muted small">' + esc(a.cost) + "</p>" +
      '<div class="opts2">' +
        '<button class="btn primary" data-appr="' + esc(a.id) + '" data-choice="approved">Approve</button>' +
        '<button class="btn" data-appr="' + esc(a.id) + '" data-choice="declined">Not now</button>' +
      "</div></article>";
  }

  function arc(x) {
    return '<ol class="arc">' + x.arc.map(function (st, i) {
      var open = st.state === "flag" || (st.state === "unknown" && i && x.arc[i - 1].state === "checked");
      return '<li class="arc-step s-' + esc(st.state) + '">' +
        '<div class="arc-head">' + mark(st.state) + "<b>" + esc(st.stage) + "</b>" +
        '<span class="muted small">' + esc(st.note) + "</span></div>" +
        (st.items.length && open !== false
          ? "<ul class=\"tight\">" + st.items.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul>"
          : "") + "</li>";
    }).join("") + "</ol>";
  }

  function steps(list) {
    if (!list || !list.length) return '<p class="muted">Nothing here yet.</p>';
    return '<ul class="steps ruled">' + list.map(function (s) {
      return "<li><div>" + esc(s.what) + ' · <span class="res t-' + esc(s.tone) + '">' + esc(s.result) + "</span></div>" +
        (s.why ? "<div>" + esc(s.why) + "</div>" : "") +
        '<div class="when">' + esc(s.who) + " · " + esc(s.at) + "</div></li>";
    }).join("") + "</ul>";
  }

  // ---- the run ---------------------------------------------------------------------------
  function tick() {
    if (step >= ALL.length) { clearInterval(timer); timer = null; return; }
    step += 1;
    render(true);
  }
  function startRun() {
    step = 0;
    clearInterval(timer);
    var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduced) { step = ALL.length; } else { step = 1; timer = setInterval(tick, 620); }
    location.hash = "#running";
  }

  // ---- routing ---------------------------------------------------------------------------
  function route() {
    var p = (location.hash || "#home").slice(1).split("/");
    return { name: p[0] || "home", arg: decodeURIComponent(p.slice(1).join("/")) };
  }

  function render(keep) {
    var r = route();
    var fn = screens[r.name] || screens.home;
    // The nav does not exist until there is something to navigate: the homepage is the product.
    var bare = r.name === "home" || r.name === "running" || r.name === "account";
    $("#chrome").hidden = bare;
    $("#main").classList.toggle("wide", r.name === "dashboard");
    var tab = { venture: "dashboard" }[r.name] || r.name;
    Array.prototype.forEach.call(document.querySelectorAll(".nav a"), function (a) {
      if (a.getAttribute("data-tab") === tab) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
    $("#view").innerHTML = fn(r.arg);
    $("#loading").hidden = true;
    var h1 = $("#view h1");
    document.title = (h1 ? h1.textContent.replace(/…/g, "") + " · " : "") + "ZoomZeem Hub";
    if (!keep) window.scrollTo(0, 0);
  }

  // Starting a slice must always do the same three things, whichever path got here.
  function startSlice(id) {
    if (!id || started[id]) return;
    started[id] = true;
    events.push({ venture: id, what: "Started the first slice.",
                  note: "Recorded in this tab. Nothing was run." });
  }

  document.addEventListener("click", function (ev) {
    var b = ev.target.closest("button, a");
    if (!b) return;
    if (b.id === "go") { ev.preventDefault(); startRun(); }
    else if (b.id === "skip") { clearInterval(timer); timer = null; step = ALL.length; render(true); }
    else if (b.dataset && b.dataset.build) {
      pending = b.dataset.build;
      if (account) {
        // Already have an account: start it here and redraw. The hash is already this venture,
        // so assigning it again fires no hashchange and nothing would repaint.
        var id = pending; pending = null;
        startSlice(id);
        if (location.hash === "#venture/" + id) render(true);
        else location.hash = "#venture/" + id;
      } else { location.hash = "#account"; }
    }
    else if (b.id === "make-account") {
      account = true;
      var keep = pending; pending = null;
      startSlice(keep);
      location.hash = keep ? "#venture/" + keep : "#dashboard";
    }
    else if (b.id === "skip-account") {
      // "Not now" must mean not now: no account, no slice started, nothing claimed.
      var go = pending; pending = null;
      location.hash = go ? "#dashboard/" + go : "#dashboard";
    }
    else if (b.dataset && b.dataset.appr) {
      answered[b.dataset.appr] = b.dataset.choice;
      var ven = null, what = "";
      D.ventures.forEach(function (y) { y.approvals.forEach(function (z) {
        if (z.id === b.dataset.appr) { ven = y.id; what = z.what; } }); });
      events.push({ venture: ven, what: "You " + b.dataset.choice + " this: " + what,
                    note: "Recorded in this tab. Nothing was run." });
      render(true);
    }
  });

  window.addEventListener("hashchange", function () { render(); $("#main").focus(); });

  $("#source-tag").textContent = isDemo ? "Demo" : "Live";
  $("#foot-storage").textContent = D.storage;
  render();
})();
</script>
</body>
</html>
